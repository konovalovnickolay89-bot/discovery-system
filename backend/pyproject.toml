[project]
name = "casual-board-backend"
version = "0.1.0"
description = "Authoritative Casual Board API (Pydantic + FastAPI + optional PydanticAI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.0",
  "pydantic-ai>=0.0.50",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.24"]

[project.scripts]
casual-board-api = "app.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
