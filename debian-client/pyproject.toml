[project]
name = "casual-board-debian-client"
version = "0.1.0"
description = "Outbound Debian CLI consumer for hosted Casual Board"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.10",
  "websockets>=12.0",
]

[project.scripts]
casual-board = "casual_board_client.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
