[project]
name = "casual-board-graph-recall-worker"
version = "0.1.0"
description = "Local Graph Recall culinary worker for Cook Studio (loopback API only)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
casual-board-graph-recall-worker = "casual_board_graph_recall_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["casual_board_graph_recall_worker*"]
